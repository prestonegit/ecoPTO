name: Push newsletter draft to Resend

on:
  push:
    branches: [main]
    paths:
      - 'src/content/newsletters/**'
  workflow_dispatch: {}

# Two pushes landing close together must not race on the status commit below.
concurrency:
  group: newsletter-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # A push event checks out the triggering commit by default. When two pushes
          # queue up, the second run would see the FIRST run's pre-send frontmatter and
          # re-blast the issue. Always work from current main instead.
          ref: main
          # Full history: the rebase in the commit-back step fails on a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Push ready-to-send issues
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          SITE_URL: https://ecopto.org
        run: npm run newsletter:push

      # always(): if a later issue in the same run throws, the earlier issue may already
      # have been emailed. Skipping this step would leave it marked 'send-now' on main
      # and it would go out again on the next push.
      - name: Commit status updates back
        if: always()
        run: |
          if [[ -n "$(git status --porcelain src/content/newsletters src/data/sent-newsletters)" ]]; then
            git config user.name "ecoPTO bot"
            git config user.email "actions@github.com"
            git add src/content/newsletters src/data/sent-newsletters
            git commit -m "Update newsletter send status"
            # Another content edit may have landed while we were pushing to Resend.
            git pull --rebase --autostash origin main
            git push
          fi
