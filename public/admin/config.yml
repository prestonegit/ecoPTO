backend:
  name: git-gateway
  branch: main

media_folder: "src/assets/images" 
public_folder: "/assets/images"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - file: "src/content/settings/global.json"
        label: "Global Site Settings"
        name: "settings"
        fields:
          - label: "Site Name"
            name: "site_name"
            widget: "string"
            default: "Hopewell Valley ecoPTO"
          - label: "Color Theme"
            name: "theme"
            widget: "select"
            options:
              - { label: "Official District Colors (Maroon & Gold)", value: "theme-district-maroon" }
              - { label: "Alternate District Colors (Blue & Gold)", value: "theme-district-blue" }
              - { label: "Seasonal - Summer", value: "theme-summer" }
              - { label: "Seasonal - Fall", value: "theme-fall" }
            default: "theme-district-maroon"

  - name: "pages"
    label: "Pages"
    files:
      - file: "src/content/pages/about-us.mdx"
        label: "About Us Page"
        name: "about"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "events"
    label: "Events"
    folder: "src/content/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Event Date", name: "eventDate", widget: "datetime" }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Banner Image", name: "image", widget: "image", required: false }
      - { label: "Description", name: "body", widget: "markdown" }

  - name: "news"
    label: "News"
    folder: "src/content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publication Date", name: "pubDate", widget: "datetime" }
      - { label: "Author", name: "author", widget: "string", default: "Hopewell ecoPTO" }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
