[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# forms.mjs imports .jsx email templates from src/, so the bundler has to handle JSX.
# esbuild (the v2 default) does; naming it explicitly keeps that from changing under us.
[functions]
  node_bundler = "esbuild"

# Netlify Forms is no longer used — every form POSTs to /api/forms, routed by the
# `config.path` export in netlify/functions/forms.mjs. See FORM_SUBMISSION.md.

# Uploaded media is served from ecopto.org itself — the same origin as /admin, where an
# editor's Netlify Identity session is kept in localStorage. A script-capable file uploaded
# through Decap's media library (which has no file-type filter) would run as ecopto.org when
# opened directly, e.g. from a newsletter link. These rules make such files inert:
#   - nosniff stops a browser treating a mislabelled upload as HTML or script;
#   - SVGs get a sandboxing CSP, so script inside one never runs, while <img src="x.svg">
#     keeps working (images don't run script anyway);
#   - HTML/XML is sandboxed and downloaded rather than rendered.
# Netlify's `*` matches within one path segment only, so each folder is listed explicitly,
# and its docs don't say how overlapping rules combine, so every rule repeats nosniff.
[[headers]]
  for = "/assets/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/images/*.svg"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'none'; style-src 'unsafe-inline'; sandbox"

[[headers]]
  for = "/assets/images/*.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'none'; sandbox"
    Content-Disposition = "attachment"

[[headers]]
  for = "/assets/images/*.htm"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'none'; sandbox"
    Content-Disposition = "attachment"

[[headers]]
  for = "/assets/images/*.xml"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'none'; sandbox"
    Content-Disposition = "attachment"

# The admin pages hold an editor's Netlify Identity session. Don't let other sites frame them
# (clickjacking a Save or Send button), don't leak admin URLs in the Referer header, and don't
# let the browser guess content types. A full script CSP isn't practical here: Decap compiles
# its config schema with new Function() and styles itself with injected <style> tags, so it
# would need 'unsafe-eval' and 'unsafe-inline', which would protect almost nothing.
[[headers]]
  for = "/admin"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    Referrer-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    Referrer-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"
